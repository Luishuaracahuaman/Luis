apiVersion: apps/v1
kind: Deployment
metadata:
  name: luishuaraca-api-deployment
  namespace: luishuaraca-ns
  labels:
    app: luishuaraca-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: luishuaraca-api
  template:
    metadata:
      labels:
        app: luishuaraca-api
    spec:
      containers:
        - name: luishuaraca-api
          image: luishuaracadev/luishuaraca-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  key: APP_ENV
                  name: luishuaraca-api-config
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  key: APP_VERSION
                  name: luishuaraca-api-config
            - name: APP_PORT
              valueFrom:
                configMapKeyRef:
                  key: APP_PORT
                  name: luishuaraca-api-config